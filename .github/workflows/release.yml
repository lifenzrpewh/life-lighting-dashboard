# Builds Pāua for field testing: the Windows installer and the Mac app
# (Apple Silicon only, the owner's call 2026-10-04), from one commit.
#
# Run it from the Actions tab (Run workflow), or push a tag `v<version>`.
# A tag drafts the release here; installed copies from 1.4.1 update from this
# repo's releases (src/shared/updates.ts), so publishing the draft is what
# offers the version to the booths. 1.1.0 to 1.4.0 read the public
# lifenzrpewh/paua-releases instead; the step drafting there too (the bridge)
# was dropped on 2026-10-22, every booth being on 1.4.1 or later (the owner).
# The files are the run's artifacts, downloaded from its page; a tag also
# makes a DRAFT GitHub Release holding them, published by hand when the time
# comes (GitHub as the place testers download from is the end goal).
# ARTIFACTS ARE KEPT ONE DAY: the release jobs read them within the run, and
# the release keeps the files. At the default 90 days, some 15 builds of
# ~250 MB filled the account's 0.5 GB of Actions storage (2026-10-13), and a
# full store fails the uploads, so no draft and no update. A Run workflow
# build without a tag must be downloaded from its page within the day.
#
# THE MAC BUILD IS UNSIGNED, ad-hoc only (`identity: "-"` in package.json):
# no Apple Developer ID yet, so macOS asks before the first open. The way past
# it is docs/FIELD_TEST.md. Hardened runtime is off because, with an ad-hoc
# signature, library validation would refuse the video addon. The addon's
# Syphon.framework is left as upstream signed it (`signIgnore`): codesign
# refuses to re-sign it, "bundle format is ambiguous" (first run, 2026-10-04).
#
# WHY THE REPORT JOB: nothing on the booth-class Windows box holds a token, so
# a run's own logs cannot be read from there. The same answer as
# texture-bridge.yml: each run pushes its build logs, the files' sizes and
# SHA-256s to the `release-build-log` branch, which plain git can fetch.
#
# Tests run on the Windows job only, without the Lua harness (no Lua on the
# runner; `npm test` locally covers it) and without the MA library (its
# tests skip and say so).

name: release (Windows + Mac)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          npm run typecheck 2>&1 | Tee-Object -FilePath logs/windows-test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run build 2>&1 | Tee-Object -Append -FilePath logs/windows-test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node --test "test/*.test.js" 2>&1 | Tee-Object -Append -FilePath logs/windows-test.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the installer
        shell: pwsh
        run: |
          npm run dist:win 2>&1 | Tee-Object -FilePath logs/windows-build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem release/*.exe | ForEach-Object {
            "$($_.Name)  $($_.Length) bytes  sha256 $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())"
          } | Set-Content -Encoding utf8 logs/windows-files.txt
      - uses: actions/upload-artifact@v6
        with:
          name: Paua-windows
          # latest.yml and the blockmap are the updater's: which version, and
          # the installer's SHA-512 (src/main/updates.ts).
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-windows
          path: logs/
          retention-days: 1

  mac:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        env:
          # Never pick up a certificate the runner happens to hold.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          mkdir -p logs
          set -o pipefail
          npm run dist:mac 2>&1 | tee logs/mac-build.log
          for f in release/*.dmg; do
            echo "$(basename "$f")  $(stat -f %z "$f") bytes  sha256 $(shasum -a 256 "$f" | cut -d' ' -f1)"
          done > logs/mac-files.txt
          # What the addon resolved to, and the signature, for the record.
          ls release/mac-arm64/Paua.app/Contents/Resources/app.asar.unpacked/node_modules/@napolab/ >> logs/mac-files.txt || true
          codesign -dv release/mac-arm64/Paua.app >> logs/mac-files.txt 2>&1 || true
      - uses: actions/upload-artifact@v6
        with:
          name: Paua-mac-arm64
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: logs-mac
          path: logs/
          retention-days: 1

  release:
    needs: [windows, mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: Paua-*
          path: files
          merge-multiple: true
      # The booth LifeBridge this version works with (its build stamp is
      # src/shared/lifebridge-build.ts): the chip tells a booth to import the
      # LifeBridge.xml from this version, so the release carries it. Never the
      # probe (LifeBridgeProbe.xml), which is not for a booth.
      - uses: actions/checkout@v6
        with:
          path: src
          sparse-checkout: console-plugin/LifeBridge.xml
          sparse-checkout-cone-mode: false
      - name: Add the booth LifeBridge
        run: cp src/console-plugin/LifeBridge.xml files/LifeBridge.xml
      - name: Draft a release holding both
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" files/* --repo "${{ github.repository }}" \
            --draft --title "Pāua ${{ github.ref_name }}" --notes "Field-test build. How to install and what to check: docs/FIELD_TEST.md."

  report:
    needs: [windows, mac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: logs-*
          path: build-log
          merge-multiple: true
      - name: Push the logs to release-build-log
        run: |
          {
            echo "run      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "from     ${{ github.sha }} (${{ github.ref_name }})"
            echo "windows  ${{ needs.windows.result }}"
            echo "mac      ${{ needs.mac.result }}"
          } > build-log/RUN.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release-build-log
          git add -f build-log
          git commit -m "release build: windows ${{ needs.windows.result }}, mac ${{ needs.mac.result }} (${{ github.sha }})"
          git push --force origin release-build-log
