# Builds @napolab/texture-bridge's Windows binary with LIFE's patch
# (native/texture-bridge/life-16bit.patch): a sender Electron cannot import,
# such as Arena with High Detail on (16 bits a channel), is converted to BGRA8
# on the GPU instead of refused. Then life-ring.patch: three staging textures
# in turn and a GPU fence, so a frame the page is drawing is never overwritten
# and none is handed on half-copied (full-screen fades tore with one).
#
# WHY HERE: the booth-class Windows box has no admin rights, and so no C++
# build tools. GitHub's Windows runners have them. The built binary is
# committed to the `texture-bridge-build` branch, so it comes back with plain
# git (`git checkout origin/texture-bridge-build -- vendor/texture-bridge`)
# and nothing on the box needs a token. A failed build pushes its logs to
# `texture-bridge-build-log` the same way, since the run's own logs need one.
#
# Everything is pinned: upstream at the commit npm's 0.15.0 was published
# from, and the Spout2 SDK at a fixed commit, so a rebuild is the same build.

name: texture-bridge (Windows, LIFE patch)

on:
  push:
    branches: [main]
    paths:
      - native/texture-bridge/**
      - .github/workflows/texture-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM: https://github.com/naporin0624/electron-texture-bridge.git
  UPSTREAM_SHA: 7f7d589809f0735ce9b1d9e7fa2e790773d401d6
  SPOUT2: https://github.com/leadedge/Spout2.git
  SPOUT2_SHA: c2bcc12147711d12ace7d5f08e869d774d840f8a

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: life

      - name: Fetch upstream at 0.15.0, byte for byte
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone --no-checkout $env:UPSTREAM up
          git -C up -c core.autocrlf=false checkout $env:UPSTREAM_SHA

      - name: Apply the LIFE patches, in order
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          foreach ($p in 'life-16bit.patch', 'life-ring.patch') {
            git -C up apply --verbose ../life/native/texture-bridge/$p 2>&1 | Tee-Object -Append -FilePath logs/apply.log
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Fetch the Spout2 SDK (pinned)
        shell: pwsh
        run: |
          git -c core.autocrlf=false clone $env:SPOUT2 _spout2
          git -C _spout2 checkout $env:SPOUT2_SHA
          New-Item -ItemType Directory -Force up/vendor/Spout2 | Out-Null
          Copy-Item -Recurse _spout2/SPOUTSDK/SpoutDirectX up/vendor/Spout2/SpoutDirectX
          Copy-Item -Recurse _spout2/SPOUTSDK/SpoutGL up/vendor/Spout2/SpoutGL

      - uses: pnpm/action-setup@v5
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build the native addon
        shell: pwsh
        working-directory: up
        run: |
          pnpm install --filter @napolab/texture-bridge 2>&1 | Tee-Object -FilePath ../logs/install.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
          pnpm --filter @napolab/texture-bridge run build 2>&1 | Tee-Object -FilePath ../logs/build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-msvc

      - name: Commit the binary to texture-bridge-build
        shell: pwsh
        run: |
          $out = "life/vendor/texture-bridge"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item up/packages/native/index.win32-x64-msvc.node $out/
          $patch = (Get-FileHash life/native/texture-bridge/life-16bit.patch -Algorithm SHA256).Hash.ToLower()
          $ring = (Get-FileHash life/native/texture-bridge/life-ring.patch -Algorithm SHA256).Hash.ToLower()
          @(
            "@napolab/texture-bridge 0.15.0, Windows x64, with LIFE's 16-bit and ring patches.",
            "upstream $env:UPSTREAM_SHA",
            "spout2   $env:SPOUT2_SHA",
            "patch    sha256 $patch",
            "ring     sha256 $ring",
            "built    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "from     ${{ github.sha }}"
          ) | Set-Content -Encoding utf8 $out/BUILD.txt
          git -C life config user.name "github-actions[bot]"
          git -C life config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C life checkout -B texture-bridge-build
          git -C life add vendor/texture-bridge
          git -C life commit -m "Build texture-bridge with the LIFE patches (${{ github.sha }})"
          git -C life push --force origin texture-bridge-build

      - name: On failure, push the logs to texture-bridge-build-log
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force life/build-log | Out-Null
          if (Test-Path logs) { Copy-Item logs/* life/build-log/ }
          "run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} from ${{ github.sha }}" | Set-Content life/build-log/RUN.txt
          git -C life config user.name "github-actions[bot]"
          git -C life config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C life checkout -B texture-bridge-build-log
          git -C life add -f build-log
          git -C life commit -m "texture-bridge build failed (${{ github.sha }})"
          git -C life push --force origin texture-bridge-build-log
